name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      # 3. Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browsers and OS system dependencies
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      # 5. Run Pytest Suite
      - name: Run Pytest Suite
        run: |
          pytest --headless

      # 6. Upload Allure or Playwright HTML Reports/Artifacts on Failure
      - name: Upload Test Artifacts (Screenshots & Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-artifacts
          path: |
            report/
            auth/
          retention-days: 7